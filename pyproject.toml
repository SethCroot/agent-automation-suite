[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Explicit selection so lint results are deterministic across ruff versions —
# ruff 0.16.3 expanded its default rule set (DTZ/S/BLE/FLY/I), which would
# turn `pip install ruff` (unpinned) in CI red on first contact.
# Add rule families deliberately, not via defaults.
select = ["E4", "E7", "E9", "F"]
